name: youtube_upload

on:
  workflow_dispatch:
  schedule:
    - cron: "30 */12 * * *"  # Runs every 12 hours

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-auth google-auth-oauthlib google-auth-httplib2 google-api-python-client PyDrive openai

      - name: Create OAuth JSON File
        run: |
          echo "${{ secrets.OAUTH_JSON }}" > credentials.json

      - name: Run Upload Script
        env:
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GMAIL_ACCOUNT: ${{ secrets.GMAIL_ACCOUNT }}
          YOUTUBE_CATEGORY_ID: ${{ secrets.YOUTUBE_CATEGORY_ID }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python main.py
